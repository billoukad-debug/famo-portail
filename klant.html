<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FAMO Seafood · Klantportaal</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/brand/famo-mark.svg?v=7bfd5fe3fc" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/atkinson-hyperlegible-next-latin.woff2?v=18b2a1a39a" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/ui.css?v=da49cc50a5">
<script src="/assets/vat.js?v=bb7009abbd" defer></script>
<script src="/assets/ui.js?v=22514afafb" defer></script>
</head>
<body class="portal-klant">
<div id="app"></div>
<style>
.kwrap{max-width:560px;margin:0 auto;min-height:100vh;background:var(--canvas);position:relative}
@media (min-width:600px) and (max-width:1023px){.kwrap{border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}.mtabs,.cartbar{left:50%;transform:translateX(-50%);width:min(560px,100%)}.cartbar{width:min(528px,calc(100% - 32px))}}
.row{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:14px;gap:12px;flex-wrap:wrap}.row>div{min-width:0}.row:last-child{border-bottom:0}.row small{display:block;color:var(--ink-2);font-size:12.5px}
/* telefoon : de kop is enkel de tabbalk onderaan ; merk, zijbalk en winkelmandpaneel verschijnen pas op de computer */
.khead{display:contents}.kbrand,.kcartlink,.kside,.kcart{display:none}
.kv-catalogus .mlist{gap:0}.kv-catalogus .sec{margin:16px 0 2px;padding-left:4px}.kv-catalogus .sec .quiet{font-weight:500}
.kcols{display:flex;flex-direction:column;gap:10px}.kc-main,.kc-side{display:flex;flex-direction:column;gap:10px;min-width:0}.kv-favorieten .kc-side{order:-1}
/* ---------- computer : kopbalk, categorieën links, productlijst, winkelmand rechts ---------- */
@media (min-width:1024px){
  .kwrap{max-width:1440px;padding:0 32px 48px}
  .khead{display:flex;align-items:center;gap:24px;position:sticky;top:0;z-index:30;height:64px;margin:0 -32px;padding:0 32px;background:var(--canvas);border-bottom:1px solid var(--line-soft)}
  .kbrand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-size:15px;white-space:nowrap}.kbrand:hover{text-decoration:none}
  .khead>.mtabs{position:static;height:64px;display:flex;gap:4px;background:transparent;border:0;padding:0;flex:1;transform:none;width:auto}
  .khead .mtab{flex-direction:row;gap:8px;font-size:14.5px;padding:0 14px;border-bottom:2px solid transparent}.khead .mtab svg{width:18px;height:18px}.khead .mtab.on{border-bottom-color:var(--p)}
  .kcartlink{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid var(--line-strong);border-radius:var(--r);color:var(--ink);font-size:14px;font-weight:500;white-space:nowrap;text-decoration:none}.kcartlink:hover{text-decoration:none;border-color:var(--p)}
  .kcartlink .ico{width:18px;height:18px}.kbadge{background:var(--p);color:#fff;border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:12px;padding:0 6px}
  .kmain>.mtop{position:static;background:transparent;border-bottom:0;padding:24px 0 16px;flex-direction:row;align-items:center;gap:24px}
  .kmain>.mtop>.mrow{flex:1;min-width:0}.kmain>.mtop .mrow>.logo,.kmain>.mtop .mrow>.avatar{display:none}
  .ktitle{font-size:24px;letter-spacing:-.3px}.ksub{font-size:13.5px}
  .kmain>.mtop .search{flex:0 1 420px;width:420px}
  .kv-catalogus .mtop .cats{display:none}
  .mlist{padding:0 0 32px}
  .cartbar{display:none}
  /* catalogus : drie kolommen */
  .kgrid{display:grid;grid-template-columns:220px minmax(0,1fr) 320px;gap:32px;align-items:start}
  .kside{display:flex;flex-direction:column;gap:2px;position:sticky;top:80px;max-height:calc(100vh - 96px);overflow:auto}
  .kside button{display:flex;justify-content:space-between;align-items:center;min-height:40px;padding:0 12px;border:0;border-radius:var(--r-sm);background:transparent;font:inherit;font-size:14px;color:var(--ink-2);cursor:pointer;text-align:left}
  .kside button:hover{background:var(--soft);color:var(--ink)}.kside button.on{background:var(--p-soft);color:var(--p-deep);font-weight:600}
  .kside button:focus-visible{outline:2px solid var(--p);outline-offset:1px}
  .kv-catalogus .mlist{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:0 16px 8px}
  .prhead{display:grid;position:sticky;top:64px;z-index:5;background:var(--card);border-bottom:1px solid var(--line);margin:0 -16px;padding:0 16px;height:40px;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink-2);}
  .prhead,.prod{grid-template-columns:minmax(0,1fr) 110px 110px 150px 44px 136px;column-gap:12px}
  .prhead>span:nth-child(4){text-align:right}
  .prod{grid-template-areas:"x k u pp fav st" "d d d d d d";padding:4px 0;contain-intrinsic-size:auto 56px}
  .prod.on{background:var(--p-soft)}
  .pm{display:none}.pr-x{align-items:center;padding:6px 0 6px 6px}
  .pr-k,.pr-u{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2);min-width:0}
  .pr-k{grid-area:k}.pr-u{grid-area:u}
  .prod>.pp{padding-left:0;justify-content:flex-end;flex-wrap:nowrap}
  .prod>.pp .quiet{font-size:12px}
  .prod:hover{background:var(--soft)}.prod.on:hover{background:var(--soft)}
  .pr-d{padding:8px 0 14px 30px}.pr-ph{width:160px;height:160px}
  .kcart{display:flex;flex-direction:column;gap:10px;position:sticky;top:80px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;max-height:calc(100vh - 96px);overflow:auto}
  .kc-h{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}.kc-h .quiet{font-size:12.5px}
  .kc-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  .kc-l li{display:grid;grid-template-columns:minmax(0,1fr) auto 36px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
  .kc-l .ibtn{width:36px;height:36px}.kc-l .ibtn svg{width:16px;height:16px}
  .kc-n{min-width:0;overflow-wrap:anywhere}.kc-n small{display:block;font-size:12px}
  .kc-t{display:flex;justify-content:space-between;font-size:15px;font-weight:600;padding-top:4px}
  .kc-min{margin:0;font-size:12.5px;color:var(--klei)}.kc-empty,.kc-foot{margin:0;font-size:12.5px}
  /* computer tot 1599 px : kaliber en eenheid onder de naam (de naam krijgt de breedte) */
  @media (max-width:1359px){.kgrid{grid-template-columns:190px minmax(0,1fr) 300px;gap:24px}}
  /* 1024–1199 : geen zijbalk, de categorieën staan weer als tabs boven de lijst */
  @media (max-width:1199px){.kgrid{grid-template-columns:minmax(0,1fr) 300px}.kside{display:none}.kmain>.mtop{flex-wrap:wrap;row-gap:12px}.kv-catalogus .mtop .cats{display:flex;flex:1 1 100%;border-bottom:1px solid var(--line-soft)}}
  @media (max-width:1599px){
    .prhead,.prod{grid-template-columns:minmax(0,1fr) 130px 44px 136px}
    .prod{grid-template-areas:"x pp fav st" "d d d d"}
    .prhead>span:nth-child(2),.prhead>span:nth-child(3),.pr-k,.pr-u{display:none}
    .prhead>span:nth-child(4){text-align:right}
    .pm{display:flex}.pr-x{align-items:flex-start}
  }
  /* andere schermen : breed maar leesbaar, twee kolommen */
  .kcols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}.kcols>.kc-side{position:sticky;top:80px;gap:12px;order:0}
  .mlist.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px;align-items:start}
  .mlist.grid>.full{grid-column:1/-1}
  .kv-bestellingen .mtop .cats{margin:0;padding:0;flex:none}
  /* Account : colonnes qui se remplissent (plus de trous quand une carte est plus haute que sa voisine) */
  .kv-account .mlist.grid{display:block;columns:2;column-gap:16px}.kv-account .mlist.grid>*{break-inside:avoid;margin:0 0 16px;display:block;width:100%}
  .kv-account .mlist.grid>#logout{width:auto;min-width:240px;display:inline-flex}
  /* Commandes : lignes en tableau */
  .kv-bestellingen .mlist.grid{display:flex;flex-direction:column;gap:16px;align-items:stretch}
  .orow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"m a"}
  .orow-main{grid-template-columns:190px minmax(0,1fr) 170px 110px 20px;grid-template-areas:"d s st t c";align-items:center}
  .orow-a{display:flex}
}
</style>
<script src="/assets/pages/klant.js?v=0b2914449d" defer></script>
</body>
</html>
