<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FAMO Seafood · Klantportaal</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273.5%27 fill=%27%234876A2%27/%3E%3Cpath d=%27M5 13V3h6M5 8h4%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%271.8%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/ui.css?v=54e3ed6788">
<script src="/assets/ui.js?v=a9793c47ae" defer></script>
</head>
<body class="portal-klant">
<div id="app"></div>
<style>
.kwrap{max-width:560px;margin:0 auto;min-height:100vh;background:var(--canvas);position:relative}
@media (min-width:600px) and (max-width:1023px){.kwrap{border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}.mtabs,.cartbar{left:50%;transform:translateX(-50%);width:min(560px,100%)}.cartbar{width:min(528px,calc(100% - 32px))}}
.row{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:14px;gap:12px;flex-wrap:wrap}.row>div{min-width:0}.row:last-child{border-bottom:0}.row small{display:block;color:var(--ink-2);font-size:12.5px}
/* ordinateur : dezelfde schermen, breder. Navigatie bovenaan, producten in een raster, winkelmand-balk rechts onder. */
@media (min-width:1024px){
  .kwrap{max-width:1200px;display:flex;flex-direction:column;padding:0 32px}
  .kwrap>.mtabs{order:-1;position:sticky;top:0;left:auto;right:auto;bottom:auto;transform:none;width:auto;height:64px;display:flex;justify-content:flex-start;gap:4px;background:var(--canvas);border-top:0;border-bottom:1px solid var(--line-soft);padding:0;margin:0 -32px;padding:0 32px;z-index:30}
  .kwrap>.mtabs .mtab{flex-direction:row;gap:8px;font-size:14.5px;padding:0 14px;border-bottom:2px solid transparent}.kwrap>.mtabs .mtab svg{width:18px;height:18px}.kwrap>.mtabs .mtab.on{border-bottom-color:var(--p)}
  .kwrap>.mtop{position:static;background:transparent;border-bottom:0;padding:28px 0 0}
  .kwrap>.mtop .cats{margin:0;padding:0;border-bottom:1px solid var(--line-soft)}
  .mlist{padding:20px 0 140px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-items:start}
  .mlist>*{grid-column:1/-1}.mlist>.prod{grid-column:auto;align-self:stretch}
  .mlist>.mcard{max-width:760px}
  .cartbar{left:max(32px,calc((100vw - 1200px)/2 + 32px));right:max(32px,calc((100vw - 1200px)/2 + 32px));bottom:24px;width:auto;transform:none;min-height:64px;padding-left:24px}
}
</style>
<script src="/assets/pages/klant.js?v=e1059ea4fe" defer></script>
</body>
</html>
