<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Famo Trading — Bestelling</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20rx='3.5'%20fill='%230C6157'/%3E%3Cg%20fill='none'%20stroke='%23fff'%20stroke-width='1.75'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M4%2013.5V2.5h8'/%3E%3Cpath%20d='M4%208h2.8c1.4%200%201.7-1.3%203.1-1.3s1.5%201.3%202.9%201.3'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/staff.css"><style>
.o-back{display:inline-block;margin-bottom:22px;color:var(--f-muted);text-decoration:none;font-size:13px}
.o-back:hover{color:var(--f-ink)}
/* Tête de dossier — le nom du client est LE moment serif de l'écran */
.o-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.o-ref{margin:0 0 5px;font:500 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--f-quiet)}
.o-head h1{margin:0;font:500 26px/1.2 var(--f-serif);letter-spacing:-.012em;color:var(--f-ink)}
/* Stepper grand format, posé sur carte */
.o-stage{margin-top:20px;padding:18px 18px 13px;border:1px solid var(--f-line);border-radius:12px;background:var(--f-surface)}
.o-stage .f-step{font-size:12.5px}
.o-stage .f-step-dot{width:10px;height:10px}
.o-stage .f-step::before{top:10px;left:calc(-50% + 11px);right:calc(50% + 11px)}
/* Métadonnées — capitales suivies .62, valeurs encre */
.o-meta{display:flex;gap:26px;flex-wrap:wrap;margin:18px 0;padding:13px 2px;border-bottom:1px solid var(--f-line);font-size:13px}
.o-meta b{display:block;margin-bottom:3px;color:var(--f-quiet);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.o-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr);gap:18px}
.o-panel{border:1px solid var(--f-line);border-radius:12px;background:var(--f-surface)}
.o-panel h2{margin:0;padding:16px 18px 12px;font-size:14.5px}
/* Lignes de commande — tableau : en-tête panel, montants tabular à droite */
.o-table{width:100%;border-collapse:collapse;font-size:13px}
.o-table th{padding:8px 18px;border-top:1px solid var(--f-line);border-bottom:1px solid var(--f-line);background:var(--f-panel);color:var(--f-quiet);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;text-align:left}
.o-table td{padding:11px 18px;border-bottom:1px solid var(--f-panel);vertical-align:top}
.o-table tr:last-child td{border-bottom:0}
.o-table td b{font-weight:500}
.o-table small{color:var(--f-quiet)}
.o-table .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.o-total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 18px;border-top:1px solid var(--f-line)}
.o-total span{color:var(--f-quiet);font-size:12.5px}
.o-total b{font-size:20px;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
/* Barre d'actions sobre en bas de carte — une seule action accent */
.o-actionbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 14px;border-top:1px solid var(--f-line);background:var(--f-panel);border-radius:0 0 12px 12px}
.o-actionbar a{text-decoration:none}
.o-actionbar .staff-action,.o-actionbar .staff-action-secondary{min-height:44px;display:inline-flex;align-items:center}
.o-dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;padding:2px 18px 18px;font-size:12.5px}
.o-dl dt{color:var(--f-quiet)}.o-dl dd{margin:0}
.o-doc{display:flex;gap:10px;align-items:center;padding:11px 18px;border-top:1px solid var(--f-panel);font-size:12.5px}
.o-doc button,.o-doc a{margin-left:auto;text-decoration:none}
.o-wait{margin-left:auto;color:var(--f-quiet);font-size:12px}
/* Washes dérivés des jetons statut — succès #1F6D4E sur son wash : 4,6:1, danger #A8371F : 5,9:1 (calculé) */
.o-notice{margin:15px 0;padding:11px 13px;border-radius:8px;background:color-mix(in srgb,var(--f-success) 9%,var(--f-surface));border:1px solid color-mix(in srgb,var(--f-success) 22%,var(--f-surface));color:var(--f-success);font-size:12.5px}
.o-notice.err{background:color-mix(in srgb,var(--f-danger) 6%,var(--f-surface));border-color:color-mix(in srgb,var(--f-danger) 24%,var(--f-surface));color:var(--f-danger)}
@media(max-width:800px){.o-grid{grid-template-columns:1fr}.o-head>div:last-child{width:100%;display:flex}.o-head>div:last-child button{flex:1}}
@media(max-width:560px){.o-table th,.o-table td{padding-left:14px;padding-right:14px}.o-total{padding:14px}.o-actionbar{padding:12px}.o-actionbar .staff-action,.o-actionbar .staff-action-secondary{flex:1;justify-content:center;text-align:center}.o-meta{gap:16px 22px}}
</style></head><body><section id="login" class="staff-login"><div><h1>Bestelling openen</h1><p>Meld u aan om de bestelling te openen.</p><input id="code" type="password" autocomplete="current-password" placeholder="Toegangscode (personeel of beheerder)"><button onclick="enter()">Aanmelden</button><div id="err" class="staff-login-error" role="alert"></div></div></section><div id="app" class="hidden staff-shell"><aside class="staff-sidebar" data-famo-nav aria-label="Personeelsnavigatie"></aside><nav class="staff-mobile-nav" data-famo-mobile-nav aria-label="Mobiele navigatie"></nav><main class="staff-main"><div class="staff-page"><a class="o-back" href="/bestellingen.html">← Alle bestellingen</a><div id="view" class="staff-loading"><div class="staff-skeleton" style="max-width:260px;margin:25px auto"></div></div></div></main></div>
<div id="advanceModal" class="doc-preview hidden" role="dialog" aria-modal="true"><div class="doc-preview-pane" style="width:min(460px,100%);height:auto"><div class="doc-preview-actions"><div><strong>Status wijzigen</strong></div><button type="button" onclick="closeAdvanceModal()">Sluiten</button></div><div style="padding:20px"><p id="advanceText" style="margin:0;color:var(--f-muted);line-height:1.5"></p><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px"><button type="button" onclick="closeAdvanceModal()">Annuleren</button><button type="button" class="doc-print" id="advanceConfirm">Bevestigen</button></div></div></div></div>
<script src="/staff-session.js"></script>
<script src="/staff-delivery.js"></script>
<script src="/staff-i18n.js"></script>
<script src="/staff-nav.js"></script>
<script>
let ORDER=null,BUSY=false;const id=new URLSearchParams(location.search).get("id")||"";
const STEPS=["Reçue","Prête","Sortie en livraison","Facturée"];
const STEP_CLASS={"Reçue":"s-ontvangen","Prête":"s-klaar","Sortie en livraison":"s-onderweg","Facturée":"s-gefactureerd"};
function magazijnHref(){return "/entrepot.html?id="+encodeURIComponent(ORDER&&ORDER.id?ORDER.id:id)}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function eur(n){return "€ "+Number(n||0).toFixed(2).replace(".",",")}
function date(v){if(!v)return"—";const x=new Date(String(v).includes("T")?v:v+"T00:00:00");return Number.isNaN(x)?v:x.toLocaleString("nl-BE",String(v).includes("T")?{dateStyle:"medium",timeStyle:"short"}:{day:"2-digit",month:"2-digit",year:"numeric"})}
function parse(v){return String(v||"").split("\n").filter(Boolean).map(x=>{const m=x.match(/^(.*?)\s*[×x]\s*([\d.,]+)\s*([^\[\(]*)(.*)$/);if(!m)return{name:x,qty:"",unit:"",price:null,comment:""};const p=(m[4]||"").match(/\[€\s*([\d.,]+)\]/),c=(m[4]||"").match(/\((.*?)\)/);return{name:m[1].trim(),qty:m[2],unit:m[3].trim(),price:p?Number(p[1].replace(",",".")):null,comment:c?c[1]:""}})}
const loginCtl=famoStaff.bindLogin({code:"code",error:"err",loginView:"login",appView:"app",onReady:load});
function enter(){loginCtl.enter()}
async function load(){const v=document.getElementById("view");v.className="staff-loading";v.innerHTML='<div class="staff-skeleton" style="max-width:260px;margin:25px auto"></div>';try{const r=await famoStaff.api("/api/allorders"),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Bestelling kon niet worden geladen.");ORDER=(d.orders||[]).find(o=>o.id===id||o.ref===id);if(!ORDER)throw new Error("Bestelling niet gevonden.");render()}catch(e){v.className="staff-error";v.innerHTML=esc(famoStaff.translateError(e.message||"Netwerkfout."))+'<br><button class="staff-action-secondary" style="margin-top:12px" onclick="load()">Opnieuw proberen</button>'}}
function docLink(type){return '/documenten.html?order='+encodeURIComponent(ORDER.id)+'&type='+type}
function stepperHtml(statut){
  const idx=STEPS.indexOf(statut);
  if(idx<0)return '<span class="staff-status" style="--status:var(--f-accent)">'+esc(famoNL.status(statut))+'</span>';
  return '<ol class="f-stepper" aria-label="Status van de bestelling">'+STEPS.map((s,i)=>
    '<li class="f-step '+STEP_CLASS[s]+(i<idx?" is-done":i===idx?" is-current":"")+'"><span class="f-step-dot"></span><span class="f-step-label">'+esc(famoNL.status(s))+'</span></li>'
  ).join("")+'</ol>';
}
function render(){const o=ORDER,l=parse(o.lignes),v=document.getElementById("view");v.className="f-enter";
  let action="";
  if(o.statut==="Reçue") action='<a class="staff-action-secondary" href="'+magazijnHref()+'">Via magazijn (per artikel)</a><button class="staff-action" onclick="quickPrep()">Snel voorbereiden</button>';
  else if(o.statut==="Prête") action=o.preparationValidee?'<button class="staff-action" onclick="depart()">Vertrek bevestigen</button>':'<a class="staff-action" href="'+magazijnHref()+'">Validatie openen</a>';
  else if(o.statut==="Sortie en livraison") action='<button class="staff-action-secondary" onclick="openDelivery()">Hier bevestigen</button><a class="staff-action" href="/leveringen.html">Open Leveringen</a>';
  else action='<button class="staff-action-secondary" onclick="paid()">'+(o.paiement==="Payé"?'Markeer openstaand':'Markeer betaald')+'</button>';
  const lbAvail=o.statut!=="Reçue",faAvail=!!o.factuurnummer,cnAvail=!!o.factuurnummer;
  const rows=l.length?l.map(x=>'<tr><td><b>'+esc(x.name)+'</b>'+(x.comment?'<br><small>'+esc(x.comment)+'</small>':'')+'</td><td class="num">'+esc(x.qty)+' '+esc(famoNL.unit(x.unit)||x.unit)+'</td><td class="num">'+(x.price==null?'—':eur(x.price))+'</td></tr>').join(""):'<tr><td colspan="3"><small>Geen artikelen geregistreerd.</small></td></tr>';
  v.innerHTML='<header class="o-head"><div><p class="o-ref">'+esc(o.ref)+'</p><h1>'+esc(o.client)+'</h1></div><div><button class="staff-ghost" onclick="load()">Vernieuwen</button></div></header>'+
  '<div id="notice"></div>'+
  '<section class="o-stage">'+stepperHtml(o.statut)+'</section>'+
  '<div class="o-meta"><div><b>Leverdatum</b>'+date(o.dateLiv)+'</div><div><b>Betaling</b>'+esc(famoNL.pay(o.paiement||"En attente"))+'</div><div><b>Factuur</b>'+esc(o.factuurnummer||"Nog niet beschikbaar")+'</div><div><b>Bron</b>'+esc((String(o.notes||"").match(/^\[([^\]]+)\]/)||[])[1]||"Klantportaal")+'</div></div>'+
  '<div class="o-grid"><section class="o-panel"><h2>Artikelen</h2><table class="o-table"><thead><tr><th>Artikel</th><th class="num">Aantal</th><th class="num">Bedrag</th></tr></thead><tbody>'+rows+'</tbody></table><div class="o-total"><span>Totaal</span><b>'+eur(o.total)+'</b></div><div class="o-actionbar">'+action+'</div></section>'+
  '<aside><section class="o-panel"><h2>Levering</h2><dl class="o-dl"><dt>Voorraad</dt><dd>'+ (o.stockAf?'Afgeboekt bij vertrek':'Nog niet afgeboekt')+'</dd><dt>Ontvangen door</dt><dd>'+esc(o.receptionnePar||"—")+'</dd><dt>Geleverd</dt><dd>'+date(o.livreeLe)+'</dd></dl></section>'+
  '<section class="o-panel" style="margin-top:14px"><h2>Documenten</h2><div class="o-doc"><span>Leveringsbon</span>'+(lbAvail?'<a class="staff-action-secondary" href="'+docLink('lb')+'">Open</a>':'<span class="o-wait">Na voorbereiding</span>')+'</div><div class="o-doc"><span>Factuur</span>'+(faAvail?'<a class="staff-action-secondary" href="'+docLink('facture')+'">Open</a>':'<span class="o-wait">Na levering</span>')+'</div><div class="o-doc"><span>Creditnota (intern)</span>'+(cnAvail?'<a class="staff-action-secondary" href="'+docLink('credit')+'">Open</a>':'<span class="o-wait">Na factuur</span>')+'</div></section></aside></div>'}
function notice(m,error){let n=document.getElementById("notice");if(!n){const v=document.getElementById("view");if(!v)return;n=document.createElement("div");n.id="notice";v.prepend(n)}n.innerHTML='<div class="o-notice'+(error?' err':'')+'">'+esc(m)+'</div>'}
async function update(p){
  if(BUSY)return;BUSY=true;
  document.querySelectorAll("button").forEach(b=>b.disabled=true);
  try{
    const r=await famoStaff.api("/api/updateorder",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({id:ORDER.id},p))});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){
      const missing=d.stock&&d.stock.missing&&d.stock.missing.length?"\nNiet in voorraad: "+d.stock.missing.join(", "):"";
      const insufficient=d.stock&&d.stock.insufficient&&d.stock.insufficient.length?"\nOnvoldoende: "+d.stock.insufficient.map(x=>x.nom+" ("+x.available+"/"+x.requested+")").join(", "):"";
      throw new Error((d.error||"Bijwerken mislukt.")+missing+insufficient);
    }
    await load();notice(d.factuurnummer?'Factuurnummer: '+d.factuurnummer:'Bestelling bijgewerkt.');
  }catch(e){notice(famoStaff.translateError(e.message||"Netwerkfout."),true)}
  finally{BUSY=false;document.querySelectorAll("button").forEach(b=>b.disabled=false)}
}
function depart(){
  document.getElementById("advanceText").textContent="Bestelling "+ORDER.ref+" naar ‘Onderweg’ verplaatsen? Voorraad wordt niet automatisch bijgewerkt (nog handmatig beheerd).";
  document.getElementById("advanceConfirm").onclick=async()=>{closeAdvanceModal();await update({statut:"Sortie en livraison",skipStock:true})};
  document.getElementById("advanceModal").classList.remove("hidden");
}
function quickPrep(){
  document.getElementById("advanceText").textContent="Bestelling "+ORDER.ref+" klaarzetten zonder artikel-per-artikel controle in het magazijn?";
  document.getElementById("advanceConfirm").onclick=async()=>{closeAdvanceModal();await update({statut:"Prête",preparationValidee:true})};
  document.getElementById("advanceModal").classList.remove("hidden");
}
function closeAdvanceModal(){document.getElementById("advanceModal").classList.add("hidden")}
function paid(){update({paiement:ORDER.paiement==="Payé"?"En attente":"Payé"})}
function openDelivery(){if(!ORDER)return;famoStaff.openDeliveryConfirm(ORDER,{onDone:async d=>{await load();notice(d.factuurnummer?'Factuurnummer: '+d.factuurnummer:'Levering bevestigd en gefactureerd.')},onError:m=>notice(m,true)})}
async function logout(){await famoStaff.logout();location.href="/bestellingen.html"}
</script></body></html>
