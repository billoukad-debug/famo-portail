<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Famo Trading — Documenten</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20rx='3.5'%20fill='%230C6157'/%3E%3Cg%20fill='none'%20stroke='%23fff'%20stroke-width='1.75'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M4%2013.5V2.5h8'/%3E%3Cpath%20d='M4%208h2.8c1.4%200%201.7-1.3%203.1-1.3s1.5%201.3%202.9%201.3'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/staff.css">
<style>
/* De bibliotheek : elk document herkenbaar aan pictogram + nummer in mono. */
.d-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.d-tools input{flex:1;min-width:230px}
.d-chips{margin-top:12px}
.d-chips .staff-chip{min-height:44px;cursor:pointer}
.d-sep{width:1px;height:22px;margin:0 4px;background:var(--f-line);align-self:center}
.d-table{margin-top:16px;border:1px solid var(--f-line);border-radius:12px;overflow:hidden;background:var(--f-surface)}
.d-table table{width:100%;border-collapse:collapse}
.d-table th{padding:10px 14px;text-align:left;background:var(--f-panel);border-bottom:1px solid var(--f-line);color:var(--f-quiet);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.d-table th.r{text-align:right}
.d-table td{padding:12px 14px;border-bottom:1px solid var(--f-line);font-size:12.5px;vertical-align:middle}
.d-table tr:last-child td{border:0}
.d-table tbody tr:hover td{background:var(--f-canvas)}
.d-id{display:flex;align-items:center;gap:10px;min-width:0}
.d-ico{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--f-panel);color:var(--f-quiet)}
.d-ico svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.d-num{display:block;font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--f-ink)}
.d-type{display:block;margin-top:2px;color:var(--f-quiet);font-size:11px}
.d-ref{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--f-accent);text-decoration:none}
.d-ref:hover{text-decoration:underline}
.d-amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.d-act{text-align:right}
.d-act a{display:inline-flex;align-items:center;text-decoration:none}
.d-blocked .d-ico{color:var(--f-faint)}
.d-blocked .d-num{color:var(--f-muted)}
.d-emptybox{margin-top:16px;border:1px solid var(--f-line);border-radius:12px;background:var(--f-surface)}
.d-doc{padding:14px 2px;border-bottom:1px solid var(--f-line)}
.d-doc:first-child{border-top:1px solid var(--f-line)}
.d-doc .d-amt{margin-left:auto;font-size:13.5px}
.d-doc p{margin:8px 0 10px;color:var(--f-quiet);font-size:12px}
.d-doc-footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.d-doc-footer button,.d-doc-footer a{min-height:44px;display:inline-flex;align-items:center;text-decoration:none}
@media(max-width:780px){.d-table{display:none!important}.d-list{display:block;margin-top:16px}.d-list .d-doc{display:block}.d-tools input{width:100%;flex:auto}}
@media(min-width:781px){.d-list{display:none}.d-doc{display:none}}
</style>
</head>
<body>
<section id="login" class="staff-login">
  <div>
    <h1>Documenten</h1>
    <p>Zoek leveringsbonnen en facturen uit de bestellingen.</p>
    <input id="code" type="password" autocomplete="current-password" placeholder="Toegangscode (personeel of beheerder)">
    <button onclick="enter()">Aanmelden</button>
    <div id="err" class="staff-login-error" role="alert"></div>
  </div>
</section>
<div id="app" class="hidden staff-shell">
  <aside class="staff-sidebar" data-famo-nav aria-label="Personeelsnavigatie"></aside>
  <nav class="staff-mobile-nav" data-famo-mobile-nav aria-label="Mobiele navigatie"></nav>
  <main class="staff-main">
    <div class="staff-page">
      <header class="staff-page-head">
        <div>
          <h1>Documenten</h1>
          <p>Interne leveringsbonnen en facturen uit de actuele bestellingen.</p>
        </div>
        <div class="staff-head-tools">
          <button class="staff-iconbtn" onclick="load()" title="Vernieuwen" aria-label="Vernieuwen"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 1.5v3h-3"/></svg></button>
        </div>
      </header>
      <div class="d-tools">
        <input id="q" class="staff-field" type="search" placeholder="Documentnummer, bestelling of klant…" oninput="render()">
      </div>
      <div class="staff-chips d-chips" role="group" aria-label="Filter op type en status">
        <button type="button" id="tp_all" class="staff-chip active" onclick="setType('all')">Alle types</button>
        <button type="button" id="tp_delivery" class="staff-chip" onclick="setType('delivery')">Leveringsbonnen</button>
        <button type="button" id="tp_invoice" class="staff-chip" onclick="setType('invoice')">Facturen</button>
        <button type="button" id="tp_credit" class="staff-chip" onclick="setType('credit')">Creditnota’s (voorbeeld)</button>
        <span class="d-sep" aria-hidden="true"></span>
        <button type="button" id="st_all" class="staff-chip active" onclick="setState('all')">Alle statussen</button>
        <button type="button" id="st_available" class="staff-chip" onclick="setState('available')">Beschikbaar</button>
        <button type="button" id="st_blocked" class="staff-chip" onclick="setState('blocked')">Geblokkeerd</button>
      </div>
      <div id="count" class="staff-count" style="margin-top:11px"></div>
      <div id="table" class="staff-loading"><div class="staff-skeleton" style="max-width:260px;margin:25px auto"></div></div>
      <div id="cards" class="d-list"></div>
    </div>
  </main>
</div>
<script src="/staff-company.js"></script>
<script src="/documents.js"></script>
<script src="/staff-doc-preview.js"></script>
<script src="/staff-session.js"></script>
<script src="/staff-i18n.js"></script>
<script src="/staff-nav.js"></script>
<script>
let ORDERS=[],DOCS=[],TYPE="all",STATE="all";
const esc=FamoDocuments.esc,eur=FamoDocuments.eur;
const URL_ORDER=new URLSearchParams(location.search).get("order")||"";
const URL_TYPE_RAW=(new URLSearchParams(location.search).get("type")||"").toLowerCase();
const TYPE_MAP={lb:"delivery",facture:"invoice",credit:"credit"};
const URL_TYPE=TYPE_MAP[URL_TYPE_RAW]||"";
function syncPills(){
  ["all","delivery","invoice","credit"].forEach(t=>{const b=document.getElementById("tp_"+t);if(b)b.classList.toggle("active",TYPE===t)});
  ["all","available","blocked"].forEach(s=>{const b=document.getElementById("st_"+s);if(b)b.classList.toggle("active",STATE===s)});
}
function setType(t){TYPE=t;syncPills();render()}
function setState(s){STATE=s;syncPills();render()}
function applyUrlFilters(){
  if(URL_TYPE){TYPE=URL_TYPE;syncPills()}
  if(URL_ORDER){
    const q=document.getElementById("q");
    if(q&&!q.value){
      const hit=ORDERS.find(o=>o.id===URL_ORDER||o.ref===URL_ORDER);
      if(hit)q.value=hit.ref;
    }
  }
}
function makeDocs(){
  DOCS=[];
  const invOk=FamoDocuments.canInvoice?FamoDocuments.canInvoice():false;
  const invReason=FamoDocuments.invoiceBlockReason?FamoDocuments.invoiceBlockReason():"IBAN/BIC ontbreken";
  ORDERS.forEach(o=>{
    DOCS.push({order:o,type:"delivery",label:"Leveringsbon",number:FamoDocuments.number(o,"delivery"),available:o.statut!=="Reçue",reason:"Beschikbaar na voorbereiding",date:o.prepareeLe||o.date||""});
    const hasFa=!!o.factuurnummer;
    DOCS.push({order:o,type:"invoice",label:"Factuur",number:o.factuurnummer||"—",available:hasFa&&invOk,reason:!hasFa?"Geblokkeerd — levering nog niet bevestigd":(invOk?"Beschikbaar":invReason),date:o.factureeLe||"",amount:hasFa?o.total:null});
    DOCS.push({order:o,type:"credit",label:"Creditnota (voorbeeld)",number:FamoDocuments.number(o,"credit"),available:hasFa,reason:hasFa?"Voorbeeld — niet geboekt in Airtable":"Beschikbaar na factuur",date:o.factureeLe||"",amount:hasFa?-Math.abs(Number(o.total||0)):null});
  });
}
const loginCtl=famoStaff.bindLogin({code:"code",error:"err",loginView:"login",appView:"app",onReady:load});
function enter(){loginCtl.enter()}
async function loadCompany(){
  try{
    const r=await famoStaff.api("/api/config");
    const d=await r.json().catch(()=>({}));
    if(r.ok&&d.config&&FamoDocuments.setCompany) FamoDocuments.setCompany(d.config);
  }catch(_){}
}
async function load(){
  const box=document.getElementById("table");
  box.className="staff-loading";
  box.innerHTML='<div class="staff-skeleton" style="max-width:260px;margin:25px auto"></div>';
  try{
    await loadCompany();
    const r=await famoStaff.api("/api/allorders"),d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||"Documenten konden niet worden geladen.");
    ORDERS=d.orders||[];
    makeDocs();
    applyUrlFilters();
    render();
    box.classList.add("f-enter");
    document.getElementById("cards").classList.add("f-enter");
    if(URL_ORDER&&URL_TYPE){
      const hit=DOCS.find(x=>(x.order.id===URL_ORDER||x.order.ref===URL_ORDER)&&x.type===URL_TYPE&&x.available);
      if(hit)setTimeout(()=>preview(hit.type,hit.order.id),120);
    }
  }catch(e){
    box.className="staff-error";
    box.innerHTML=esc(famoStaff.translateError(e.message||"Netwerkfout."))+'<br><button class="staff-action-secondary" style="margin-top:12px" onclick="load()">Opnieuw proberen</button>';
  }
}
function filter(){
  const q=document.getElementById("q").value.toLowerCase();
  return DOCS.filter(d=>(!q||(d.number+" "+d.order.ref+" "+d.order.client).toLowerCase().includes(q))&&(TYPE==="all"||d.type===TYPE)&&(STATE==="all"||(STATE==="available"&&d.available)||(STATE==="blocked"&&!d.available)));
}
function icoPaths(t){
  if(t==="delivery")return '<path d="M3.5 8 12 3.5 20.5 8v8L12 20.5 3.5 16z"/><path d="M3.5 8 12 12.5 20.5 8M12 12.5v8"/>';
  if(t==="credit")return '<path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M14.5 3.5V8H19"/><path d="M15 14.5H9.6M11.9 12.3 9.6 14.5l2.3 2.2"/>';
  return '<path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M14.5 3.5V8H19"/><path d="M9.5 12.5h5M9.5 16h5"/>';
}
function ico(t){return '<span class="d-ico" aria-hidden="true"><svg viewBox="0 0 24 24">'+icoPaths(t)+'</svg></span>'}
function act(d){return d.available?'<button class="staff-action-secondary" onclick="preview(\''+d.type+'\',\''+esc(d.order.id)+'\')">Bekijken</button>':(d.type==="invoice"?'<a class="staff-action-secondary" href="/beheer.html">Vul IBAN in</a>':'')}
function row(d){
  return '<tr'+(d.available?'':' class="d-blocked"')+'><td><div class="d-id">'+ico(d.type)+'<div><span class="d-num">'+esc(d.number)+'</span><span class="d-type">'+d.label+'</span></div></div></td>'
    +'<td><a class="d-ref" href="/order.html?id='+encodeURIComponent(d.order.id)+'">'+esc(d.order.ref)+'</a></td>'
    +'<td>'+esc(d.order.client)+'</td>'
    +'<td>'+FamoDocuments.date(d.date)+'</td>'
    +'<td class="d-amt">'+(d.amount==null?'—':eur(d.amount))+'</td>'
    +'<td><span class="staff-status" style="--status:'+(d.available?'#1F6D4E':'var(--f-danger)')+'">'+esc(d.available?'Beschikbaar':d.reason)+'</span></td>'
    +'<td class="d-act">'+act(d)+'</td></tr>';
}
function card(d){
  return '<article class="d-doc'+(d.available?'':' d-blocked')+'"><div class="d-id">'+ico(d.type)+'<div><span class="d-num">'+esc(d.number)+'</span><span class="d-type">'+d.label+'</span></div>'+(d.amount==null?'':'<span class="d-amt">'+eur(d.amount)+'</span>')+'</div>'
    +'<p>'+esc(d.order.ref)+' · '+esc(d.order.client)+' · '+FamoDocuments.date(d.date)+'</p>'
    +'<div class="d-doc-footer"><span class="staff-status" style="--status:'+(d.available?'#1F6D4E':'var(--f-danger)')+'">'+esc(d.available?'Beschikbaar':d.reason)+'</span>'+act(d)+'</div></article>';
}
function render(){
  const list=filter(),table=document.getElementById("table"),cards=document.getElementById("cards");
  document.getElementById("count").textContent=list.length+(list.length===1?" document":" documenten");
  if(!list.length){
    table.className="d-emptybox";
    table.innerHTML='<div class="staff-empty f-empty"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M14.5 3.5V8H19"/><path d="M9.5 12.5h5M9.5 16h5"/></svg><b>Geen documenten voor deze selectie</b><p>Pas de filters aan of zoek op nummer, bestelling of klant.</p></div>';
    cards.innerHTML="";
    return;
  }
  table.className="d-table";
  table.innerHTML='<table><thead><tr><th>Document</th><th>Bestelling</th><th>Klant</th><th>Datum</th><th class="r">Bedrag</th><th>Status</th><th></th></tr></thead><tbody>'+list.map(row).join("")+'</tbody></table>';
  cards.innerHTML=list.map(card).join("");
}
function preview(type,id){
  const order=ORDERS.find(o=>o.id===id);
  if(!order)return;
  if(type==="invoice"&&FamoDocuments.canInvoice&&!FamoDocuments.canInvoice()){
    const msg=FamoDocuments.invoiceBlockReason?FamoDocuments.invoiceBlockReason():"IBAN/BIC ontbreken";
    famoDocPreview.open({
      title:"Factuur geblokkeerd",
      meta:order.ref||"",
      filename:"geblokkeerd.txt",
      html:"<!doctype html><html><body style='font-family:sans-serif;padding:32px'><h1>Factuur geblokkeerd</h1><p>"+FamoDocuments.esc(msg)+"</p><p><a href='/beheer.html'>Open Beheer</a></p></body></html>"
    });
    return;
  }
  const labels={delivery:"Leveringsbon",invoice:"Factuur",credit:"Creditnota (voorbeeld)"};
  const num=FamoDocuments.number(order,type);
  let html;
  try{html=FamoDocuments.build(order,type)}
  catch(e){
    famoDocPreview.open({
      title:"Document geblokkeerd",
      meta:order.ref||"",
      filename:"geblokkeerd.txt",
      html:"<!doctype html><html><body style='font-family:sans-serif;padding:32px'><h1>Document geblokkeerd</h1><p>"+FamoDocuments.esc(e.message||e)+"</p></body></html>"
    });
    return;
  }
  famoDocPreview.open({
    title:labels[type]||"Document",
    meta:num+" · "+(order.ref||""),
    filename:FamoDocuments.filename(order,type),
    html
  });
}
async function logout(){await loginCtl.logout()}
</script>
</body>
</html>
