<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FAMO Seafood · Wachtwoord vergeten</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273.5%27 fill=%27%234B57DB%27/%3E%3Cpath d=%27M5 13V3h6M5 8h4%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%271.8%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/ui.css">
<script src="/assets/ui.js"></script>
</head>
<body class="portal-klant">
<div id="app"></div>
<script>
document.getElementById("app").innerHTML='<div style="max-width:480px;margin:0 auto;padding:24px 16px"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><a href="/" style="font-size:13px">'+K.t("← Aanmelden")+'</a>'+K.langSwitch()+'</div><h1 class="h1" style="margin-top:18px">'+K.t("Wachtwoord vergeten")+'</h1><p class="sub" style="white-space:normal">'+K.t("Uw wachtwoord wordt door FAMO Seafood beheerd. Bel of mail ons: wij zetten meteen een nieuw wachtwoord klaar en sturen het naar het e-mailadres van uw zaak.")+'</p><div class="card card-b" style="margin-top:16px;display:flex;flex-direction:column;gap:8px" id="contact"><b>FAMO Seafood</b><span class="muted">'+K.t("Gegevens laden…")+'</span></div></div>';
K.api("/api/config?public=1").then(d=>{const c=d.config||{};document.getElementById("contact").innerHTML="<b>"+K.esc(c.bedrijfsnaam||"FAMO Seafood")+"</b>"+(c.telefoon?"<a href=\"tel:"+K.esc(String(c.telefoon).replace(/\s+/g,""))+"\">"+K.esc(c.telefoon)+"</a>":"")+(c.email?"<a href=\"mailto:"+K.esc(c.email)+"\">"+K.esc(c.email)+"</a>":"")+"<span class=\"quiet\" style=\"font-size:12px\">"+K.esc([c.adres,c.plaats].filter(Boolean).join(", "))+"</span>"}).catch(()=>{});
</script>
</body>
</html>
