<!DOCTYPE html><html lang="nl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Famo Trading — Beheer</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20rx='3.5'%20fill='%230C6157'/%3E%3Cg%20fill='none'%20stroke='%23fff'%20stroke-width='1.75'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M4%2013.5V2.5h8'/%3E%3Cpath%20d='M4%208h2.8c1.4%200%201.7-1.3%203.1-1.3s1.5%201.3%202.9%201.3'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/staff.css">
<style>
/* Onglets : soulignement accent 2px sous l'actif, libelles .70 -> encre. */
.b-tabs{display:flex;gap:2px;margin-top:22px;border-bottom:1px solid var(--f-line);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.b-tabs::-webkit-scrollbar{display:none}
.b-tabs button{position:relative;flex:none;min-height:44px;padding:0 13px;border:0;background:transparent;color:var(--f-muted);font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.b-tabs button::after{content:"";position:absolute;left:13px;right:13px;bottom:0;height:2px;border-radius:1px;background:var(--f-accent);transform:scaleX(0)}
.b-tabs button:hover{color:var(--f-ink)}
.b-tabs button.active{color:var(--f-ink)}
.b-tabs button.active::after{transform:scaleX(1);animation:b-tab-in .15s cubic-bezier(.2,.7,.3,1)}
@keyframes b-tab-in{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.b-tabs button .n{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;margin-left:7px;border-radius:9999px;background:var(--f-accent);color:#fff;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.b-panel{margin-top:24px}
/* Tete de section : capitales suivies en .62, phrase d'aide en .62. */
.b-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.b-head h2{margin:0 0 4px;font-size:12px;font-weight:600;color:var(--f-quiet);text-transform:uppercase;letter-spacing:.07em}
.b-head p{margin:0;color:var(--f-quiet);font-size:13px;max-width:62ch;line-height:1.5}
.b-progress{font-variant-numeric:tabular-nums;font-size:22px;font-weight:500;letter-spacing:-.01em;color:var(--f-ink);white-space:nowrap}
.b-progress i{font-style:normal;font-size:13px;font-weight:500;color:var(--f-quiet)}
/* Cartes de chiffres : sans + tabular-nums, graisse 500 (jamais de mono ici). */
.b-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:11px}
.b-card{border:1px solid var(--f-line);border-radius:12px;background:#fff;padding:15px 16px}
.b-card .v{display:block;font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.b-card .l{display:block;font-size:11.5px;color:var(--f-quiet);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;font-weight:600}
.b-card.warn{border-color:var(--f-warning-line,#E7D6A9);background:var(--f-warning-wash,#FBF3DF)}
.b-card.warn .v{color:var(--f-warning)}
.b-card.ok .v{color:var(--f-success)}
/* Checklist de completude : coche accent = fait, cercle vide = a faire. */
.b-checklist{border:1px solid var(--f-line);border-radius:12px;background:#fff;overflow:hidden}
.b-meter{height:2px;background:var(--f-panel)}
.b-meter i{display:block;height:100%;background:var(--f-accent)}
.b-check-item{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:12px 16px;border:0;border-bottom:1px solid var(--f-panel);background:transparent;text-align:left;cursor:pointer;font:inherit}
.b-check-item:last-child{border-bottom:0}
.b-check-item:hover{background:rgba(224,237,232,.45)}
.b-check-dot{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--f-faint);display:grid;place-items:center;color:#fff}
.b-check-item.is-done .b-check-dot{border-color:var(--f-accent);background:var(--f-accent)}
.b-check-dot svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.b-check-txt{flex:1;min-width:0}
.b-check-txt b{display:block;font-size:13.5px;font-weight:500;color:var(--f-ink)}
.b-check-item.is-done .b-check-txt b{color:var(--f-muted)}
.b-check-txt small{display:block;font-size:12px;color:var(--f-quiet);margin-top:1px;line-height:1.45}
.b-check-go{flex:none;color:var(--f-quiet);font-size:12px;white-space:nowrap}
.b-check-item:hover .b-check-go{color:var(--f-accent)}
/* Listes : en-tete panel en capitales suivies, survol lavis tres leger. */
.b-list{border:1px solid var(--f-line);border-radius:12px;background:#fff;overflow:hidden}
.b-list-head{display:flex;justify-content:space-between;gap:13px;padding:9px 16px;background:var(--f-panel);border-bottom:1px solid var(--f-line);color:var(--f-quiet);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.b-list-head .grow{flex:1}
.b-row{display:flex;gap:13px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--f-panel);flex-wrap:wrap}
.b-row:last-child{border-bottom:0}
.b-row:hover{background:rgba(224,237,232,.45)}
.b-row .grow{flex:1;min-width:190px}
.b-row b{font-size:14px;font-weight:600;display:block}
.b-row span.sub{font-size:12.5px;color:var(--f-quiet);line-height:1.5}
.b-row .acts{display:flex;gap:7px;flex-wrap:wrap}
.b-amt{font-variant-numeric:tabular-nums;font-weight:500;color:var(--f-ink)}
/* Formulaires : libelles au-dessus, aide en .62, groupes separes par filets. */
.b-form{border:1px solid var(--f-line);border-radius:12px;background:#fff;padding:18px;margin-bottom:16px}
.b-form h3{margin:0 0 3px;font-size:14.5px}
.b-form .hint{margin:0 0 15px;font-size:12.5px;color:var(--f-quiet);line-height:1.5}
.b-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.b-grid .full{grid-column:1/-1}
.b-grid label{display:block;font-size:11.5px;font-weight:600;color:var(--f-quiet);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.b-grid input,.b-grid select{width:100%}
.b-group{border-top:1px solid var(--f-line);padding-top:13px;margin-top:4px}
.b-group span{font-size:11px;font-weight:600;color:var(--f-quiet);text-transform:uppercase;letter-spacing:.07em}
.b-acts{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.b-check{display:flex;gap:9px;align-items:center;font-size:13.5px;color:var(--f-muted);font-weight:500}
.b-check input{width:auto}
.b-creds{margin-top:15px;border:1px solid var(--f-success-line,#C6DCCB);background:var(--f-success-wash,#E6F0E9);border-radius:12px;padding:15px}
.b-creds small{display:block;font-size:11.5px;color:var(--f-success);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px}
.b-creds .kv{display:flex;gap:10px;align-items:baseline;margin-bottom:5px;font-size:13px}
.b-creds .kv i{font-style:normal;color:var(--f-muted);min-width:88px}
.b-creds code{font:600 13.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:#fff;border:1px solid var(--f-success-line,#C6DCCB);border-radius:6px;padding:3px 8px}
.b-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--f-ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;z-index:200;display:none;max-width:min(560px,92vw);line-height:1.5;box-shadow:0 10px 34px rgba(60,45,30,.22)}
.b-toast.err{background:var(--f-danger)}
.b-note{border:1px solid var(--f-warning-line,#E7D6A9);background:var(--f-warning-wash,#FBF3DF);color:var(--f-warning);border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.55;margin-bottom:16px}
.b-note a{color:var(--f-ink);font-weight:600}
.b-search{margin-bottom:13px;display:flex;gap:9px;flex-wrap:wrap}
.b-search input{flex:1;min-width:210px}
@media(max-width:620px){.b-row .acts{width:100%}.b-row .acts button{flex:1}}
.b-danger{border:1px solid rgba(168,55,31,.25);background:rgba(168,55,31,.06);color:var(--f-danger);min-height:38px;padding:0 14px;border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer}
.b-danger:hover{background:rgba(168,55,31,.12)}
/* Toegang : deux roles en cartes surface, badge d'etat de code, formulaire sous filet.
   Contrastes calcules : #1F6D4E sur #E6F0E9 = 5,4:1 · #8A6110 sur #FBF3DF = 5,0:1. */
.b-roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:16px}
.b-role{border:1px solid var(--f-line);border-radius:12px;background:#fff;padding:18px}
.b-role-top{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:10px}
.b-role-ico{flex:none;width:34px;height:34px;border-radius:8px;background:var(--f-wash);display:grid;place-items:center;color:var(--f-accent-2)}
.b-role-ico svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.b-role h3{margin:0;font-size:14.5px;font-weight:600}
.b-role p{margin:0 0 10px;color:var(--f-muted);font-size:13px;line-height:1.5}
.b-role p.b-role-hint{margin-bottom:14px;color:var(--f-quiet);font-size:12.5px}
.b-role-form{border-top:1px solid var(--f-line);padding-top:14px}
.b-badge{display:inline-flex;align-items:center;margin-left:auto;min-height:22px;padding:2px 10px;border-radius:9999px;font-size:11px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.b-badge.ok{background:var(--f-success-wash,#E6F0E9);border:1px solid var(--f-success-line,#C6DCCB);color:var(--f-success)}
.b-badge.env{background:var(--f-warning-wash,#FBF3DF);border:1px solid var(--f-warning-line,#E7D6A9);color:var(--f-warning)}
.b-footnote{margin:0 0 16px;color:var(--f-quiet);font-size:13px;line-height:1.5}
.b-footnote a{color:var(--f-accent);font-weight:500}
</style></head><body>

<section id="login" class="staff-login"><div>
  <h1>Beheer</h1>
  <p>Alleen voor beheerders. Klanten, producten, prijzen en bedrijfsgegevens.</p>
  <input id="code" type="password" autocomplete="current-password" placeholder="Toegangscode (beheerder)">
  <button type="button" onclick="enter()">Aanmelden</button>
  <div id="err" class="staff-login-error" role="alert"></div>
</div></section>

<div id="app" class="hidden staff-shell">
  <aside class="staff-sidebar" data-famo-nav aria-label="Personeelsnavigatie"></aside>
  <nav class="staff-mobile-nav" data-famo-mobile-nav aria-label="Mobiele navigatie"></nav>
  <main class="staff-main"><div class="staff-page">
    <header class="staff-page-head">
      <div><h1>Beheer</h1><p>Alles wat u instelt voor het portaal: klanten, producten, prijzen en bedrijfsgegevens.</p></div>
      <div><button class="staff-ghost" onclick="refresh()">Vernieuwen</button></div>
    </header>
    <div class="b-tabs" id="tabs"></div>
    <div class="b-panel" id="panel"><div class="staff-loading"><div class="staff-skeleton" style="max-width:260px;margin:25px auto"></div></div></div>
  </div></main>
</div>
<div id="toast" class="b-toast" role="status"></div>

<script src="/staff-session.js"></script>
<script src="/staff-i18n.js"></script>
<script src="/staff-nav.js"></script>
<script>
let DATA=null,TAB="overzicht",BUSY=false,CREDS=null,EDIT_CLIENT=null,EDIT_PRODUCT=null,PREFILL=null,QC="",QP="";
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const eur=n=>"€ "+Number(n||0).toFixed(2).replace(".",",");
const val=id=>{const el=document.getElementById(id);return el?el.value.trim():""};
const checked=id=>{const el=document.getElementById(id);return!!(el&&el.checked)};

const loginCtl=famoStaff.bindLogin({code:"code",error:"err",loginView:"login",appView:"app",requireAdmin:true,onReady:refresh});
function enter(){loginCtl.enter()}

function toast(msg,isErr){
  const el=document.getElementById("toast");
  el.textContent=msg;el.className="b-toast"+(isErr?" err":"");el.style.display="block";
  clearTimeout(toast._t);toast._t=setTimeout(()=>{el.style.display="none"},5000);
}

async function refresh(){
  try{
    DATA=await famoStaff.apiJson("/api/onboarding");
    render(true);
  }catch(e){
    document.getElementById("panel").innerHTML='<div class="staff-error">'+esc(famoStaff.translateError(e.message||"Netwerkfout."))+'<br><button class="staff-action-secondary" style="margin-top:12px" onclick="refresh()">Opnieuw proberen</button></div>';
  }
}

async function post(payload,okMsg){
  if(BUSY)return false;
  BUSY=true;
  try{
    const d=await famoStaff.apiJson("/api/onboarding",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    DATA=d;
    if(okMsg)toast(okMsg);
    return d;
  }catch(e){
    toast(famoStaff.translateError(e.message||"Opslaan mislukt"),true);
    return false;
  }finally{BUSY=false}
}

function go(tab){TAB=tab;CREDS=null;render(true)}

function render(animate){
  if(!DATA)return;
  const s=DATA.status||{},nA=(DATA.aanvragen||[]).length;
  const tabs=[
    ["overzicht","Overzicht",0],
    ["aanvragen","Aanvragen",nA],
    ["klanten","Klanten",0],
    ["producten","Producten",0],
    ["prijzen","Prijzen",0],
    ["bedrijf","Bedrijfsgegevens",0],
    ["toegang","Toegang",0]
  ];
  // On ne reconstruit les onglets que s'ils changent : l'animation du
  // soulignement ne rejoue ainsi qu'au vrai changement d'onglet.
  const tabsHtml=tabs.map(t=>
    '<button class="'+(TAB===t[0]?"active":"")+'" onclick="go(\''+t[0]+'\')">'+esc(t[1])+(t[2]?'<span class="n">'+t[2]+'</span>':'')+'</button>'
  ).join("");
  if(tabsHtml!==render._tabs){render._tabs=tabsHtml;document.getElementById("tabs").innerHTML=tabsHtml}
  const p=document.getElementById("panel");
  p.className="b-panel";
  if(TAB==="overzicht")renderOverzicht(p,s);
  else if(TAB==="aanvragen")renderAanvragen(p);
  else if(TAB==="klanten")renderKlanten(p);
  else if(TAB==="producten")renderProducten(p);
  else if(TAB==="prijzen")renderPrijzen(p);
  else if(TAB==="bedrijf")renderBedrijf(p);
  else renderToegang(p);
  if(animate){void p.offsetWidth;p.classList.add("f-enter")}
}

function renderOverzicht(p,s){
  const nA=(DATA.aanvragen||[]).length,c=DATA.config||{};
  const cards=[
    [nA,"Open aanvragen",nA?"warn":""],
    [s.clients||0,"Klanten",""],
    [s.credentials||0,"Met login",""],
    [s.catalogue||0,"Actieve producten",""],
    [s.prijzen||0,"Afgesproken prijzen",""],
    [s.orders||0,"Bestellingen",""]
  ];
  let warn="";
  if(nA) warn+='<div class="b-note">Er '+(nA>1?'zijn '+nA+' nieuwe aanvragen':'is 1 nieuwe aanvraag')+' via de website. <a href="#" onclick="go(\'aanvragen\');return false">Behandelen</a></div>';

  const isExample=String(c.iban||"").replace(/\s/g,"").toUpperCase()==="BE68539007547034";
  const items=[
    {done:!!s.identiteit&&!isExample,label:"Bedrijfsgegevens volledig",tab:"bedrijf",go:"Bedrijfsgegevens",
      hint:isExample?"Het IBAN is nog het voorbeeldnummer — vervang het vóór de eerste factuur.":"Naam, BTW-nummer, IBAN en BIC voor op de documenten."},
    {done:(s.catalogue||0)>0,label:"Minstens één actief product",tab:"producten",go:"Producten",
      hint:"Zonder producten blijft de catalogus voor klanten leeg."},
    {done:(s.clients||0)>0,label:"Minstens één klant",tab:"klanten",go:"Klanten",
      hint:"Elke klant bestelt met een eigen login."},
    {done:(s.clients||0)>0&&(s.credentials||0)>=(s.clients||0),label:"Elke klant kan aanmelden",tab:"klanten",go:"Klanten",
      hint:(s.clients?(s.credentials||0)+" van "+s.clients+" klanten heeft een login met wachtwoord.":"Maak eerst een klant aan.")},
    {done:(s.clients||0)>0&&!(s.klantenZonderEmail||0),label:"Elke klant heeft een e-mailadres",tab:"klanten",go:"Klanten",
      hint:(s.klantenZonderEmail?s.klantenZonderEmail+" klant"+(s.klantenZonderEmail>1?"en":"")+" zonder adres krijgt geen bestelbevestiging.":"Nodig voor de bestelbevestiging.")},
    {done:!!s.mailReady,label:"Bestelmeldingen ingesteld",tab:"bedrijf",go:"Bedrijfsgegevens",
      hint:(s.mailEnabled?"Bij elke nieuwe bestelling ontvangt u een e-mail op dit adres.":"Verzenden is nog niet geconfigureerd op de server.")},
    {done:!!(c.adminCodeCustom&&c.staffCodeCustom),label:"Eigen toegangscodes ingesteld",tab:"toegang",go:"Toegang",
      hint:"Vervang de codes uit de Vercel-omgeving door eigen codes."},
    {done:!nA,label:"Geen openstaande aanvragen",tab:"aanvragen",go:"Aanvragen",
      hint:(nA?nA+" aanvraag"+(nA>1?"en wachten":" wacht")+" op behandeling.":"Nieuwe aanvragen via de website verschijnen hier.")}
  ];
  const done=items.filter(i=>i.done).length;
  const pct=Math.round(done/items.length*100);
  const CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12.5l4 4 9-9"/></svg>';

  p.innerHTML=warn+
    '<div class="b-head"><div><h2>In cijfers</h2><p>De stand van het portaal op dit moment.</p></div></div>'+
    '<div class="b-cards">'+cards.map(c2=>'<div class="b-card '+c2[2]+'"><span class="v">'+c2[0]+'</span><span class="l">'+esc(c2[1])+'</span></div>').join("")+'</div>'+
    '<div class="b-head" style="margin-top:30px"><div><h2>Klaar om te verkopen</h2><p>Alles aangevinkt? Dan is het portaal helemaal klaar voor gebruik. Klik op een punt om het meteen te regelen.</p></div><span class="b-progress">'+done+'<i> / '+items.length+'</i></span></div>'+
    '<div class="b-checklist"><div class="b-meter"><i style="width:'+pct+'%"></i></div>'+
      items.map(i=>
        '<button type="button" class="b-check-item'+(i.done?' is-done':'')+'" onclick="go(\''+i.tab+'\')">'+
        '<span class="b-check-dot">'+(i.done?CHECK:'')+'</span>'+
        '<span class="b-check-txt"><b>'+esc(i.label)+'</b><small>'+esc(i.hint)+'</small></span>'+
        '<span class="b-check-go">'+esc(i.go)+' →</span></button>'
      ).join("")+
    '</div>'+
    '<div class="b-head" style="margin-top:30px"><div><h2>Snel naar</h2><p>De dagelijkse schermen staan in het menu links. Hier beheert u wat daarachter zit.</p></div></div>'+
    '<div class="staff-chips" style="margin-top:0">'+
      '<a class="staff-chip" href="/bestellingen.html">Bestellingen</a>'+
      '<a class="staff-chip" href="/entrepot.html">Magazijn</a>'+
      '<a class="staff-chip" href="/leveringen.html">Leveringen</a>'+
      '<a class="staff-chip" href="/documenten.html">Documenten</a>'+
      '<a class="staff-chip" href="/" target="_blank">Klantportaal openen</a>'+
    '</div>';
}

function renderAanvragen(p){
  const list=DATA.aanvragen||[];
  let h='<div class="b-head"><div><h2>Aanvragen via de website</h2><p>Mensen die een account hebben aangevraagd op de openbare pagina. Maak er een klant van, of markeer als behandeld.</p></div></div>';
  if(!list.length){
    h+='<div class="b-list"><div class="staff-empty f-empty">'+
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.7 5.5h10.6l2.2 8v5h-15v-5z"/><path d="M4.5 13.5h4.2l1.3 2.5h4l1.3-2.5h4.2"/></svg>'+
      '<b>Geen openstaande aanvragen</b><p>Vraagt iemand een account aan via de website, dan verschijnt de aanvraag hier.</p></div></div>';
  }else{
    h+='<div class="b-list"><div class="b-list-head"><span class="grow">Aanvraag</span><span>Acties</span></div>'+list.map(a=>
      '<div class="b-row"><div class="grow"><b>'+esc(a.bedrijfsnaam)+'</b><span class="sub">'+esc(a.contactpersoon)+' · '+esc(a.email)+(a.telefoon?' · '+esc(a.telefoon):'')+
      (a.adres?'<br>'+esc(a.adres):'')+(a.notities?'<br><i>'+esc(a.notities)+'</i>':'')+'</span></div>'+
      '<div class="acts"><button class="staff-action-secondary" onclick="useAanvraag(\''+esc(a.id)+'\')">Klant aanmaken</button>'+
      '<button class="staff-ghost" onclick="closeAanvraag(\''+esc(a.id)+'\')">Behandeld</button></div></div>'
    ).join("")+'</div>';
  }
  p.innerHTML=h;
}

function useAanvraag(id){
  const a=(DATA.aanvragen||[]).find(x=>x.id===id);
  if(!a)return;

async function saveClient(){
  const nom=val("cnom");
  if(!nom){toast("Bedrijfsnaam is verplicht.",true);return}
  const gen=checked("cgen");
  const email=val("cmail");
  if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast("Dit e-mailadres lijkt niet geldig.",true);return}
  const payload={action:"saveClient",nom,adresse:val("cadr"),tel:val("ctel"),email,btw:val("cbtw"),klantnr:val("cnr"),user:val("cuser"),generate:gen};
  if(EDIT_CLIENT&&EDIT_CLIENT.id)payload.id=EDIT_CLIENT.id;
  const d=await post(payload);
  if(!d)return;
  const creds=(!payload.id||gen)?(d.credentials||null):null;
  const aid=PREFILL&&PREFILL.aanvraagId;
  let warn=false;
  if(!payload.id&&aid){
    const c=await post({action:"closeAanvraag",id:aid});
    if(!c)warn=true;
  }
  CREDS=creds;EDIT_CLIENT=null;PREFILL=null;
  render();
  toast((payload.id?"Klant bijgewerkt":"Klant aangemaakt")+(warn?" — let op: de aanvraag kon niet als behandeld worden gemarkeerd, controleer dit om dubbele klanten te vermijden.":""),warn);
}

async function saveConfig(){
  const nom=val("fnom"),btw=val("fbtw");
  if(!nom||!btw){toast("Bedrijfsnaam en BTW-nummer zijn verplicht.",true);return}
  const iban=val("fiban").replace(/\s+/g,"").toUpperCase();
  if(iban&&!/^[A-Z]{2}[0-9A-Z]{13,32}$/.test(iban)){toast("Dit IBAN lijkt niet geldig. Controleer het nummer.",true);return}
  const tar=Number(val("ftar"));
  if(val("ftar")&&(!Number.isFinite(tar)||tar<0||tar>100)){toast("BTW-tarief moet tussen 0 en 100 liggen.",true);return}
  const ok=await post({action:"saveConfig",bedrijfsnaam:nom,adres:val("fadr"),plaats:val("fpl"),btw,
    telefoon:val("ftel"),email:val("fmail"),iban,bic:val("fbic"),
    btwTarief:val("ftar")?tar:undefined,
    betalingsvoorwaarden:val("fbet"),leveringsvoorwaarden:val("flev"),
    bestellingenEmail:val("fops")},"Bedrijfsgegevens opgeslagen");
  if(ok)render();
}
</script>
</body></html>
