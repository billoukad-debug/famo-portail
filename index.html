<body class="portal-klant">
<div id="app"></div>
<style>
.start{min-height:100vh;display:flex;flex-direction:column}
.start-hd{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;gap:12px;flex-wrap:wrap}
.start-body{flex:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;padding:20px clamp(16px,8vw,120px) 30px;align-items:center}
.hero h1{font-size:clamp(28px,4vw,44px);line-height:1.1;letter-spacing:-.03em;font-weight:600}
.hero p{font-size:15px;color:var(--ink-2);margin:14px 0 0;max-width:460px;line-height:1.55}
.proof{display:flex;gap:18px;margin-top:24px;flex-wrap:wrap}.proof div{font-size:12.5px;color:var(--ink-2)}.proof b{display:block;font-size:20px;color:var(--ink)}
.login{padding:28px;display:flex;flex-direction:column;gap:14px;max-width:440px;width:100%;justify-self:end;box-shadow:var(--lift);border-color:transparent}
.start-ft{display:flex;align-items:center;justify-content:space-between;padding:16px 24px 20px;border-top:1px solid var(--line-soft);background:var(--canvas);gap:12px;flex-wrap:wrap}
.mini{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}.mini a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--r);color:var(--ink);font-weight:500;background:var(--card)}.mini a:hover{text-decoration:none;background:var(--soft)}.mini a i{width:8px;height:8px;border-radius:50%;display:inline-block}
@media (max-width:860px){.start-body{grid-template-columns:1fr;gap:24px}.login{justify-self:stretch;max-width:none}.hero p{max-width:none}}
</style>
<script src="/assets/pages/start.js?v=cfc5410f55" defer></script>
</body>
</html>
