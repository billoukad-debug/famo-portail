<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Famo Trading — Bestellingen</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20rx='3.5'%20fill='%230C6157'/%3E%3Cg%20fill='none'%20stroke='%23fff'%20stroke-width='1.75'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M4%2013.5V2.5h8'/%3E%3Cpath%20d='M4%208h2.8c1.4%200%201.7-1.3%203.1-1.3s1.5%201.3%202.9%201.3'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/staff.css">
<style>
/* Filtres : recherche + bouton « Filters » (badge du nombre actif) + tri.
   Les six listes deroulantes vivent dans un panneau replie — plus de mur de
   selects sur telephone. */
.orders-tools{display:flex;gap:8px;align-items:center;margin-top:18px}
.orders-tools input{flex:1;min-width:0}
.orders-tools .staff-select{flex:none;max-width:44vw}
.filters-panel{display:none;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:10px;padding:12px;border:1px solid var(--f-line);border-radius:12px;background:var(--f-panel)}
.filters-panel.open{display:grid}
.filters-panel label{display:block}
.filters-panel span{display:block;margin:0 0 4px 2px;color:var(--f-quiet);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.filters-panel select{width:100%}
/* Haut de page sur deux lignes : titre + compteurs essentiels, puis recherche, filtres, tri et nombre.
   Open et Te bevestigen doublent les colonnes du bord : visibles seulement quand la place le permet.
   « Aandacht vereist » se déplie avec le panneau Filters. */
.b-head{align-items:center;flex-wrap:nowrap;gap:12px}
.b-head h1{flex:none}
.b-head .staff-chips{flex:1 1 auto;min-width:0;margin:0;padding:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.b-head .staff-chips::-webkit-scrollbar{display:none}
.b-head .staff-chip{flex:none;white-space:nowrap}
.b-head .staff-head-tools{flex:none}
.b-head+.orders-tools{margin-top:12px}
.orders-count{flex:none;white-space:nowrap}
@media(max-width:1199px){.staff-chip.chip-extra{display:none}}
#filtersPanel:not(.open)~#attentionBox{display:none!important}
/* Board du matin — 4 colonnes de statut, teinte panel + filet (règle 5h du matin) */
.m-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px;align-items:start}
.m-col{display:flex;flex-direction:column;gap:9px;padding:10px;border:1px solid var(--f-line);border-radius:12px;background:var(--f-panel)}
.m-col-head{display:flex;align-items:center;gap:7px;padding:5px 5px 0;color:var(--f-quiet);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.m-col-head::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--col,#77706A)}
.m-col-head b{margin-left:auto;font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--f-muted)}
/* La carte n'est plus un lien entier (elle porte des icônes documents) : un lien couvre la carte, les icônes passent au-dessus. */
.m-card-link{position:absolute;inset:0;z-index:0;border-radius:inherit}
.m-card-link:focus-visible{outline:2px solid var(--f-accent);outline-offset:2px}
.m-card .m-card-foot{flex-wrap:wrap;row-gap:4px}
.m-card{position:relative;display:block;padding:12px 13px;border:1px solid var(--f-line);border-radius:12px;background:var(--f-surface);text-decoration:none;color:var(--f-ink)}
/* Contenu de la carte (date, client, articles, total) : staff-card.js + staff.css, commun avec Magazijn. */
.m-pay{color:var(--f-quiet);font-size:11.5px}
.m-pay.open{color:var(--f-warning)} /* ambre #8A6110 sur blanc : 5,5:1 (calculé) */
.m-col .staff-empty.f-empty{padding:26px 12px;gap:4px}
.m-col .f-empty p{font-size:12.5px}
/* Afgehandeld (gefactureerd én betaald) : hors du bord ; une ligne discrète dit combien et permet de les montrer. */
.m-hidden{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;padding:0 5px;color:var(--f-quiet);font-size:12.5px}
.m-hidden button{margin-left:auto}
/* Références et alertes */
.order-ref{font:500 12.5px ui-monospace,SFMono-Regular,Menlo,monospace}
.order-alert{display:inline-flex;align-items:center;gap:5px;color:var(--f-warning);font-size:11.5px}
.order-alert:before{content:"!";display:grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--f-warning-wash,#FBF3DF);font-weight:600}
.orders-note{margin-top:16px;color:var(--f-quiet);font-size:12px}
.orders-state{margin-top:20px}
.staff-attention{margin-top:18px;padding:14px 16px;border:1px solid var(--f-line);border-radius:12px;background:var(--f-surface)}
.staff-attention h2{margin:0 0 10px;font-size:14px;font-weight:600}
.staff-attention-list{display:flex;flex-direction:column;gap:0}
.staff-attention-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--f-panel);text-decoration:none;color:var(--f-ink)}
.staff-attention-item:first-child{border-top:0;padding-top:0}
.staff-attention-item .order-ref{flex:0 0 auto}
.staff-attention-client{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.staff-attention-item .staff-status{margin-left:auto}
@media(max-width:1120px){.m-board{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.orders-tools{flex-wrap:wrap}.orders-tools input{flex:1 1 100%}.orders-tools .staff-select{flex:1;max-width:none}.filters-panel{grid-template-columns:1fr 1fr}.m-board{grid-template-columns:1fr}}
</style>
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>
<section id="loginView" class="staff-login">
  <div><h1>Bestellingen</h1><p>Meld u aan om de operationele bestellijst te openen.</p><input id="code" type="password" autocomplete="current-password" placeholder="Toegangscode (personeel of beheerder)"><button onclick="enter()">Aanmelden</button><div id="loginError" class="staff-login-error" role="alert"></div></div>
</section>

<div id="app" class="hidden staff-shell">
  <aside class="staff-sidebar" data-famo-nav aria-label="Personeelsnavigatie"></aside>
  <nav class="staff-mobile-nav" data-famo-mobile-nav aria-label="Mobiele navigatie"></nav>
  <main class="staff-main"><div class="staff-page">
    <header class="staff-page-head b-head"><h1>Bestellingen</h1>
      <section id="chips" class="staff-chips" aria-label="Snelle filters"></section>
      <div class="staff-head-tools"><button class="staff-iconbtn" onclick="load()" title="Vernieuwen" aria-label="Vernieuwen"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 1.5v3h-3"/></svg></button></div>
    </header>
    <section class="orders-tools" aria-label="Bestellingen filteren">
      <input id="search" class="staff-field" type="search" placeholder="Zoek referentie, klant, artikel of factuur…" oninput="render()">
      <button id="filtersBtn" type="button" class="staff-filterbtn" onclick="toggleFilters()" aria-expanded="false" aria-controls="filtersPanel">Filters<span class="n" id="filtersCount"></span></button>
      <select id="sort" class="staff-select" onchange="onFilterChange()" aria-label="Sorteren"><option value="delivery">Leverdatum</option><option value="recent">Nieuwste eerst</option><option value="client">Klant A–Z</option><option value="total">Hoogste totaal</option></select>
      <span id="count" class="staff-count orders-count" role="status"></span>
    </section>
    <div id="filtersPanel" class="filters-panel">
      <label><span>Status</span><select id="status" class="staff-select" onchange="onFilterChange()"><option value="all">Alle statussen</option><option value="open">Open (niet gefactureerd)</option><option value="Reçue">Ontvangen</option><option value="Prête">Klaar</option><option value="Sortie en livraison">Onderweg</option><option value="Facturée">Gefactureerd</option></select></label>
      <label><span>Betaling</span><select id="payment" class="staff-select" onchange="onFilterChange()"><option value="all">Alle betalingen</option><option value="En attente">Openstaand</option><option value="Payé">Betaald</option></select></label>
      <label><span>Bron</span><select id="source" class="staff-select" onchange="onFilterChange()"><option value="all">Alle bronnen</option><option value="Klantportaal">Klantportaal</option><option value="WhatsApp">WhatsApp</option><option value="Telefoon">Telefoon</option><option value="E-mail">E-mail</option><option value="Ter plaatse">Ter plaatse</option></select></label>
      <label><span>Leverdatum</span><select id="dateFilter" class="staff-select" onchange="onFilterChange()"><option value="all">Alle datums</option><option value="today">Levering vandaag</option><option value="tomorrow">Levering morgen</option><option value="overdue">Te laat</option><option value="undated">Zonder leverdatum</option></select></label>
      <label><span>Aandacht</span><select id="attention" class="staff-select" onchange="onFilterChange()"><option value="all">Alle aandacht</option><option value="required">Aandacht vereist</option></select></label>
      <label><span>Afgehandeld</span><select id="afgehandeld" class="staff-select" onchange="onFilterChange()"><option value="verbergen">Verbergen</option><option value="tonen">Tonen</option></select></label>
    </div>
    <section id="attentionBox" class="staff-attention hidden" aria-label="Aandacht vereist"></section>
    <div id="state" class="orders-state"></div>
    <section id="board" class="m-board" aria-label="Bestellingen per status"></section>
    <p class="orders-note">Bedragen excl. btw. Prijzen worden op de server berekend en bij het aanmaken vastgezet. Open een bestelling voor voorbereiding, levering en documenten.</p>
  </div></main>
</div>
<script src="/staff-company.js"></script>
<script src="/documents.js"></script>
<script src="/staff-session.js"></script>
<script src="/staff-i18n.js"></script>
<script src="/staff-card.js"></script>
<script src="/staff-doc-actions.js"></script>
<script src="/staff-nav.js"></script>
<script>
let ORDERS=[],STOCK=[],LAST_ERROR="",FIRST_PAINT=true,HIDDEN_AFGEHANDELD=0;
famoDocActions.setSource(()=>ORDERS);
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
const eur=n=>"€ "+Number(n||0).toFixed(2).replace(".",",");
const statusColor={"Reçue":"#77706A","Prête":"#8A6110","Sortie en livraison":"#2C6E7E","Facturée":"#1F6D4E"};
const COLS=[
  {key:"Reçue",color:"#77706A",empty:["Geen nieuwe bestellingen","Rustig begin. Zodra een klant bestelt, verschijnt de bestelling hier."]},
  {key:"Prête",color:"#8A6110",empty:["Niets klaargezet","Zet een ontvangen bestelling klaar via het magazijn."]},
  {key:"Sortie en livraison",color:"#2C6E7E",empty:["Geen leveringen onderweg","Bevestig het vertrek zodra een bestelling de deur uitgaat."]},
  {key:"Facturée",color:"#1F6D4E",empty:["Nog niets gefactureerd","Bevestigde leveringen verschijnen hier met hun factuurnummer."]}
];
function sourceOf(order){const m=String(order.notes||"").match(/^\[([^\]]+)\]/);return m?m[1]:"Klantportaal"}
function dateLabel(value){if(!value)return"—";const d=new Date(value+"T00:00:00");return Number.isNaN(d)?value:d.toLocaleDateString("nl-BE",{day:"2-digit",month:"2-digit",year:"numeric"})}
function isAttention(o){return (o.statut==="Prête"&&!o.preparationValidee)||(o.statut==="Sortie en livraison"&&!o.livraisonConfirmee)}
/* Afgehandeld = gefactureerd én betaald. Filtre d'affichage seulement : la commande quitte le bord
   mais reste dans Airtable, dans Documenten et sur sa fiche ; « Afgehandeld: Tonen » la remontre.
   Gefactureerd mais impayée reste sur le bord : c'est de l'argent à récupérer. */
function isAfgehandeld(o){return o.statut==="Facturée"&&o.paiement==="Payé"}
function localDay(offset=0){
  const base=new Date(new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Brussels"}).format(new Date())+"T12:00:00");
  base.setDate(base.getDate()+offset);
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Brussels"}).format(base);
}
function matchesDate(o,filter){const day=String(o.dateLiv||"").slice(0,10);if(filter==="all")return true;if(filter==="undated")return !day;if(filter==="today")return day===localDay();if(filter==="tomorrow")return day===localDay(1);return Boolean(day&&day<localDay()&&o.statut!=="Facturée")}
function dayKey(v){return String(v||"").slice(0,10)}
const loginCtl=famoStaff.bindLogin({
  code:"code",error:"loginError",loginView:"loginView",appView:"app",
  onDom(){
    const params=new URLSearchParams(location.search);
    ["status","payment","source","dateFilter","attention","afgehandeld","sort"].forEach(name=>{
      const field=document.getElementById(name),value=params.get(name);
      if(field&&value&&[...field.options].some(option=>option.value===value))field.value=value;
    });
    syncFiltersBadge();
  },
  onReady:load
});
function enter(){loginCtl.enter()}
async function load(){
  const state=document.getElementById("state");
  state.innerHTML='<div class="staff-loading"><div class="staff-skeleton" style="max-width:220px;margin:0 auto"></div><div class="staff-skeleton" style="max-width:380px;margin:12px auto 0"></div></div>';
  try{
    /* /api/stock is enkel voor beheerders : personeel vraagt het niet op (anders 401-lus) en een mislukte stockcall mag de pagina nooit breken. */
    const wantStock=famoStaff.getRole()==="admin";
    const [a,b]=await Promise.all([
      famoStaff.api("/api/allorders"),
      wantStock?famoStaff.api("/api/stock").catch(()=>null):Promise.resolve(null)
    ]);
    const ad=await a.json().catch(()=>({}));
    if(!a.ok)throw new Error(ad.error||"Bestellingen konden niet worden geladen.");
    ORDERS=ad.orders||[];
    STOCK=[];
    if(b&&b.ok){const bd=await b.json().catch(()=>({}));STOCK=bd.items||[]}
    LAST_ERROR="";
    render();
  }catch(error){LAST_ERROR=famoStaff.translateError(error.message||"Netwerkfout.");render()}
}
function statusMatch(o,status){if(status==="all")return true;if(status==="open")return o.statut!=="Facturée";return o.statut===status}
function filtered(){const term=document.getElementById("search").value.trim().toLowerCase(),status=document.getElementById("status").value,payment=document.getElementById("payment").value,source=document.getElementById("source").value,dateFilter=document.getElementById("dateFilter").value,attention=document.getElementById("attention").value,sort=document.getElementById("sort").value;const matching=ORDERS.filter(o=>{const hay=[o.ref,o.client,o.lignes,o.factuurnummer].join(" ").toLowerCase();return(!term||hay.includes(term))&&statusMatch(o,status)&&(payment==="all"||o.paiement===payment)&&(source==="all"||sourceOf(o)===source)&&matchesDate(o,dateFilter)&&(attention==="all"||isAttention(o))});const list=document.getElementById("afgehandeld").value==="tonen"?matching:matching.filter(o=>!isAfgehandeld(o));HIDDEN_AFGEHANDELD=matching.length-list.length;return list.sort((a,b)=>{if(sort==="delivery")return String(a.dateLiv||"9999").localeCompare(String(b.dateLiv||"9999"));if(sort==="client")return String(a.client).localeCompare(String(b.client));if(sort==="total")return Number(b.total)-Number(a.total);return String(b.date||"").localeCompare(String(a.date||""))})}
function syncUrlFromFilters(){
  const params=new URLSearchParams();
  ["status","payment","source","dateFilter","attention","afgehandeld","sort"].forEach(name=>{
    const field=document.getElementById(name);
    if(!field)return;
    const v=field.value;
    if(!v||v==="all")return;
    if(name==="sort"&&v==="delivery")return;
    if(name==="afgehandeld"&&v==="verbergen")return;
    params.set(name,v);
  });
  const q=params.toString();
  const next=location.pathname+(q?"?"+q:"")+location.hash;
  const cur=location.pathname+location.search+location.hash;
  if(next!==cur) history.replaceState(null,"",next);
}
function onFilterChange(){syncUrlFromFilters();syncFiltersBadge();render()}
function showAfgehandeld(){document.getElementById("afgehandeld").value="tonen";onFilterChange()}
function activeFilterCount(){
  let n=0;
  ["status","payment","source","dateFilter","attention","afgehandeld"].forEach(name=>{
    const field=document.getElementById(name);
    if(field&&field.value&&field.value!=="all"&&!(name==="afgehandeld"&&field.value==="verbergen"))n++;
  });
  return n;
}
function syncFiltersBadge(){
  const n=activeFilterCount();
  document.getElementById("filtersCount").textContent=n?String(n):"";
  /* Un filtre pose via l'URL (chips, liens) doit etre visible : on deplie. */
  if(n&&!document.getElementById("filtersPanel").classList.contains("open"))toggleFilters(true);
}
function toggleFilters(forceOpen){
  const panel=document.getElementById("filtersPanel"),btn=document.getElementById("filtersBtn");
  const open=forceOpen===true?true:!panel.classList.contains("open");
  panel.classList.toggle("open",open);
  btn.setAttribute("aria-expanded",open?"true":"false");
}
function chipActive(href){
  const u=new URL(href,location.origin),p=u.searchParams;
  const cur=new URLSearchParams(location.search);
  if(u.pathname.endsWith("/stock.html"))return false;
  const keys=["status","payment","dateFilter","attention"];
  const has=keys.some(k=>p.has(k));
  if(!has)return !keys.some(k=>cur.get(k)&&cur.get(k)!=="all");
  return keys.every(k=>{
    const want=p.get(k),got=cur.get(k);
    if(!want)return !got||got==="all";
    return got===want;
  });
}
function renderChips(){
  const t=localDay();
  const today=ORDERS.filter(o=>dayKey(o.dateLiv)===t&&o.statut!=="Facturée").length;
  const open=ORDERS.filter(o=>o.statut!=="Facturée").length;
  const confirm=ORDERS.filter(o=>o.statut==="Sortie en livraison").length;
  /* Te betalen = gefactureerd en nog niet betaald : l'argent à récupérer, pas les commandes pas encore facturées. */
  const unpaid=ORDERS.filter(o=>o.statut==="Facturée"&&o.paiement==="En attente").length;
  const late=ORDERS.filter(o=>dayKey(o.dateLiv)&&dayKey(o.dateLiv)<t&&o.statut!=="Facturée").length;
  const attn=ORDERS.filter(isAttention).length;
  const chips=[
    {href:"/bestellingen.html?dateFilter=today",count:today,label:"Vandaag"},
    {href:"/bestellingen.html?status=open",count:open,label:"Open",extra:true},
    {href:"/leveringen.html",count:confirm,label:"Te bevestigen",extra:true},
    {href:"/bestellingen.html?status=Factur%C3%A9e&payment=En%20attente",count:unpaid,label:"Te betalen"},
    {href:"/bestellingen.html?dateFilter=overdue",count:late,label:"Te laat"},
    {href:"/bestellingen.html?attention=required",count:attn,label:"Aandacht"}
  ];
  document.getElementById("chips").innerHTML=chips.map(c=>
    '<a class="staff-chip'+(chipActive(c.href)?" active":"")+(c.extra?" chip-extra":"")+'" href="'+c.href+'"><b>'+c.count+'</b> '+esc(c.label)+'</a>'
  ).join("");
}
function renderAttention(){
  const box=document.getElementById("attentionBox");
  const all=ORDERS.filter(isAttention);
  const items=all.slice(0,6);
  if(!items.length){box.classList.add("hidden");box.innerHTML="";return}
  box.classList.remove("hidden");
  const more=all.length>6?'<a class="staff-attention-more" href="/bestellingen.html?attention=required">Toon alles ('+all.length+')</a>':'<a class="staff-attention-more" href="/bestellingen.html?attention=required">Filter op aandacht</a>';
  box.innerHTML='<h2>Aandacht vereist</h2><div class="staff-attention-list">'+items.map(o=>
    '<a class="staff-attention-item" href="/order.html?id='+encodeURIComponent(o.id)+'">'+
    '<span class="order-ref">'+esc(o.ref)+'</span>'+
    '<span class="staff-attention-client">'+esc(o.client)+'</span>'+
    '<span class="staff-status" style="--status:'+statusColor[o.statut]+'">'+esc(famoNL.status(o.statut))+'</span>'+
    '</a>'
  ).join("")+'</div>'+more;
}
function orderCard(o){
  const foot=isAttention(o)
    ?'<span class="order-alert">Aandacht</span>'
    :'<span class="m-pay'+(o.paiement==="Payé"?'':' open')+'">'+esc(famoNL.pay(o.paiement||"En attente"))+'</span>';
  return '<div class="m-card f-lift"><a class="m-card-link" href="/order.html?id='+encodeURIComponent(o.id)+'" aria-label="Bestelling '+esc(o.ref)+' openen"></a>'+famoCard.html(o,{foot:foot+famoDocActions.iconsHtml(o),maxLines:3})+'</div>';
}
function render(){
  const state=document.getElementById("state"),board=document.getElementById("board");
  renderChips();
  if(LAST_ERROR){
    board.innerHTML="";
    document.getElementById("count").textContent="";
    document.getElementById("attentionBox").classList.add("hidden");
    state.innerHTML='<div class="staff-error">'+esc(LAST_ERROR)+'<br><button class="staff-action-secondary" style="margin-top:12px" onclick="load()">Opnieuw proberen</button></div>';
    return;
  }
  renderAttention();
  if(!ORDERS.length){
    board.innerHTML="";
    document.getElementById("count").textContent="";
    state.innerHTML='<div class="staff-empty f-empty"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8.5 12 3.5l8.5 5v7L12 20.5l-8.5-5z"/><path d="M3.5 8.5 12 13.5l8.5-5M12 13.5v7"/></svg><b>Geen bestellingen vandaag</b><p>Zodra een klant bestelt of u er zelf één invoert, verschijnt de bestelling hier.</p><a class="staff-action-secondary" href="/invoer.html">Bestelling invoeren</a></div>';
    return;
  }
  const list=filtered(),sort=document.getElementById("sort").value;
  state.innerHTML="";
  document.getElementById("count").textContent=list.length+' van '+ORDERS.length+' bestellingen'+(HIDDEN_AFGEHANDELD?' · '+HIDDEN_AFGEHANDELD+' afgehandeld verborgen':'');
  board.innerHTML=COLS.map(c=>{
    let colList=list.filter(o=>o.statut===c.key);
    /* Gefactureerd ne fait que grandir : triée par leverdatum, les plus récentes en haut. */
    if(c.key==="Facturée"&&sort==="delivery")colList=colList.sort((a,b)=>String(b.dateLiv||"").localeCompare(String(a.dateLiv||"")));
    let body;
    const hiddenHere=c.key==="Facturée"?HIDDEN_AFGEHANDELD:0;
    if(colList.length){
      body=colList.map(orderCard).join("");
    }else if(hiddenHere){
      body='<div class="staff-empty f-empty"><b>Alles betaald</b><p>Gefactureerde en betaalde bestellingen staan niet meer op het bord.</p></div>';
    }else if(ORDERS.some(o=>o.statut===c.key)){
      body='<div class="staff-empty f-empty"><b>Geen resultaten</b><p>Pas de filters of de zoekopdracht aan.</p></div>';
    }else{
      body='<div class="staff-empty f-empty"><b>'+esc(c.empty[0])+'</b><p>'+esc(c.empty[1])+'</p></div>';
    }
    if(hiddenHere)body+='<div class="m-hidden"><span>'+hiddenHere+(hiddenHere===1?' afgehandelde bestelling':' afgehandelde bestellingen')+' verborgen</span><button type="button" class="staff-action-secondary" onclick="showAfgehandeld()">Tonen</button></div>';
    return '<section class="m-col" data-col="'+esc(c.key)+'">'+
      '<header class="m-col-head" style="--col:'+c.color+'">'+esc(famoNL.status(c.key))+'<b>'+colList.length+'</b></header>'+
      body+'</section>';
  }).join("");
  if(FIRST_PAINT){FIRST_PAINT=false;board.classList.add("f-enter")}
}
async function logout(){await loginCtl.logout()}
</script>
</body>
</html>
